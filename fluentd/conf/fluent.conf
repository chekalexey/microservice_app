#принимаем логи
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

#парсим лог
<filter **>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type none
  </parse>
</filter>

#отправляем логи в Elasticsearch
<match **>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix fluentd-logs
  <buffer>
    @type memory
    flush_interval 5s
  </buffer>
</match>