name: Python

on:
  push:
    branches:
      - '**'
    paths:
      - '**.py'
      - 'requirements*.txt'
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ 3.11 ]
    
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          pip install flake8 isort
          pip install -r requirements.txt
      
      - name: Lint & Test
        run: |
          flake8 . --ignore=W292,W291,E501,E302 --count --statistics