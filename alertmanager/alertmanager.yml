global:
  resolve_timeout: 5m

route:
  receiver: 'telegram'
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: 'telegram'
    telegram_configs:
      - bot_token: 'insert yours'
        chat_id: insert_yours
        parse_mode: 'HTML'
        message: |
          🚨 <b>{{ .CommonLabels.alertname }}</b>: {{ .CommonAnnotations.summary }}
          📋 <b>Описание:</b> {{ .CommonAnnotations.description }}
          📊 <b>Статус:</b> {{ .Status }}