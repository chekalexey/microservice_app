apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'api'
        static_configs:
          - targets: ['api.app:5000']
      - job_name: 'web'
        static_configs:
          - targets: ['web.app:5050']
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']