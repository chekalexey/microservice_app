apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: app
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5050
          name: http
        env:
        - name: API_URL
          value: "http://api.app:5000"
        - name: JAEGER_HOST
          value: "jaeger-collector.monitoring"
        - name: JAEGER_ENDPOINT
          value: "http://jaeger-collector.monitoring:4318/v1/traces"
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch.app:9200"
        livenessProbe:
          httpGet:
            path: /health
            port: 5050
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: app
spec:
  type: NodePort
  selector:
    app: web
  ports:
  - port: 5050
    targetPort: 5050
    nodePort: 30080