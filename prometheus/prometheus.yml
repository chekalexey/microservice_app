global:
  scrape_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - "/etc/prometheus/rules/alerts.yml"

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:5000']

  - job_name: 'web'
    static_configs:
      - targets: ['web:5050']